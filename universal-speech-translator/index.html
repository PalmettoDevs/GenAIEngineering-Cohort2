<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Speech Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Speech Translator</h1>
            <p class="subtitle">Speak in any language &mdash; get real-time translations</p>
        </header>

        <div class="controls">
            <div class="language-select">
                <label for="source-lang">Listen for:</label>
                <select id="source-lang">
                    <option value="auto">Auto-detect</option>
                </select>
            </div>
            <button id="swap-btn" class="swap-btn" title="Swap languages">&#8644;</button>
            <div class="language-select">
                <label for="target-lang">Translate to:</label>
                <select id="target-lang">
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="translator-panels">
            <div class="panel source-panel">
                <div class="panel-header">
                    <span class="panel-label">Original</span>
                    <span id="detected-lang" class="detected-lang"></span>
                </div>
                <div id="source-text" class="text-area" contenteditable="true"
                     data-placeholder="Press the microphone and start speaking..."></div>
                <div class="panel-footer">
                    <button id="clear-source" class="icon-btn" title="Clear">&#10005;</button>
                </div>
            </div>

            <div class="panel target-panel">
                <div class="panel-header">
                    <span class="panel-label">Translation</span>
                </div>
                <div id="target-text" class="text-area"
                     data-placeholder="Translation will appear here..."></div>
                <div class="panel-footer">
                    <button id="speak-translation" class="icon-btn" title="Speak translation">&#128264;</button>
                    <button id="copy-translation" class="icon-btn" title="Copy translation">&#128203;</button>
                </div>
            </div>
        </div>

        <div class="mic-container">
            <button id="mic-btn" class="mic-btn" title="Start listening">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <div id="mic-status" class="mic-status">Click microphone to start</div>
        </div>

        <div id="history" class="history">
            <h3>Translation History</h3>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
